// SMAC Ultr@ R52 ports (smac_u_netcode / smac_u_movement / smac_u_aimbot / smac_u_cheatcfg).
// Ultr@ semantics: Ban 0 = detector OFF, so keep non-zero values here and let
// smac_observe_new 1 suppress the kick/ban. Reaction cvars: 1 = admin notice.
smac_PSilent_Warning "1"
smac_PSilent_Ban "-12"
smac_aimbot_Advanced_Warning_PRG "1"
smac_aimbot_Advanced_Ban_PRG "5"
smac_aimbot_Advanced_Warning_AGTNL "1"
