smac_ssac_ladder_ban "0"
smac_ssac_fastrun_ban "0"
smac_ssac_lag_ban "0"
smac_move_wish_ban "0"
smac_move_autoshoot_ban "0"
smac_AdvancedTrigger_Ban "0"
smac_AdvancedAutoFire_Ban "0"
smac_NoR_Ban "0"
smac_SoundESP "0"
smac_AIM_Kill "0"
smac_SpeedTeleport "0"
smac_SpeedTeleport_fast "0"
