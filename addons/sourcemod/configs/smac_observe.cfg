// SMAC v34 observe mode — new detectors log + admin notice only.
// Legacy modules (aimbot, eyetest, autotrigger, commands, cvars, client flood, status) still ban/kick.
// Exec manually: exec sourcemod/smac_observe.cfg
// Disable observe: smac_observe_new 0

smac_observe_new "1"
smac_log_verbose "1"

// Legacy enforcement (unchanged)
smac_aimbot_ban "3"
smac_eyetest_ban "1"
smac_autotrigger_action "1"

// New / ported modules — detect + notify, no punish
smac_psilent_ban "0"
smac_aimlock_ban "0"
smac_aimorigin_ban "0"
smac_triggerbot_ban "0"
smac_turn_mouse_ban "0"
smac_turn_desync_ban "0"
smac_turn_wiggle_ban "0"
